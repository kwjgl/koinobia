<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>소식 · 코이노비아</title>
<meta name="description" content="코이노비아와 세 앱의 소식, 그리고 개발 노트예요.">
<meta name="theme-color" content="#FFFFFF">
<meta property="og:type" content="website">
<meta property="og:title" content="소식 · 코이노비아">
<meta property="og:description" content="코이노비아와 세 앱의 소식, 그리고 개발 노트예요.">
<meta property="og:image" content="https://koinobia.com/og.png">
<meta property="og:url" content="https://koinobia.com/news/">
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/page.css?v=20261111-5">
<link rel="stylesheet" href="/tabs.css?v=20261111">
</head>
<body data-tab="news">
<header class="nav gut">
  <div class="nav-in box">
    <a class="brand" href="/" id="brand" aria-label="코이노비아 홈"></a>
    <nav class="toplinks" id="toplinks" aria-label="메뉴"></nav>
    <a class="btn btn-sm" id="navOpen" href="#" hidden></a>
  </div>
</header>

<main class="gut">
  <div class="news-wrap">
  <!-- 넓은 화면: 왼쪽에 붙어 있는 목록(news.js에서 채워요) -->
  <aside class="toc" id="toc" aria-label="소식 목록"></aside>
  <div class="news-main">
    <div class="head">
      <p class="eyebrow">소식</p>
      <h1 class="title">코이노비아 소식</h1>
      <p class="lead">앱 업데이트와 안내, 그리고 앱을 만들며 쓴 개발 노트를 전해 드려요.</p>
      <div class="chips" id="chips" role="tablist" aria-label="소식 종류">
        <button type="button" role="tab" data-type="all" aria-selected="true">전체</button>
        <button type="button" role="tab" data-type="notice" aria-selected="false">공지</button>
        <button type="button" role="tab" data-type="note" aria-selected="false">개발 노트</button>
      </div>
      <!-- 앱 고르기: 노트가 있는 앱이 둘 이상이면 "개발 노트"를 골랐을 때 나와요 -->
      <div class="app-chips" id="appChips" hidden></div>
      <!-- 휴대폰: 눌러서 펼치는 목록 -->
      <details class="toc-m" id="tocM"><summary>목록 보기</summary><div id="tocMIn"></div></details>
    </div>
    <!-- 소식은 news.js에서 가져와 채워요 -->
    <div class="body" id="list"></div>
  </div>
  </div>
</main>
<dialog class="shot-dialog" id="shotDialog" aria-label="앱 화면 사진 확대">
  <div class="shot-dialog-in">
    <button type="button" id="shotClose" class="shot-close" aria-label="사진 닫기">닫기 ×</button>
    <img id="shotLarge" alt="">
    <p id="shotCaption"></p>
  </div>
</dialog>

<footer class="foot gut">
  <div class="foot-in box">
    <span class="foot-brand" id="footBrand"></span>
    <span class="foot-links" id="foot"></span>
  </div>
</footer>
<script src="/site.js?v=20261111-2"></script>
<script src="/news.js?v=20261111-6"></script>
<script src="/tabs.js?v=20261111-2"></script>
<script>
(function () {
  var NEWS = (window.KOINOBIA_NEWS || []).map(function (n, i) { n._i = i; return n; });
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  // 한 줄 안의 꾸밈: **굵게**, [글자](https://주소 · /주소 · #노트id)
  function inline(s) {
    return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+|\/[^)\s]*|#[\w-]+)\)/g, '<a href="$2">$1</a>');
  }
  // 본문: 빈 줄로 덩어리를 나눠요. "### "는 작은 제목, "> "는 인용, "- "는 점 목록
  function body(text) {
    return String(text || '').trim().split(/\n\s*\n/).map(function (block) {
      var lines = block.split('\n').map(function (l) { return l.trim(); }).filter(Boolean), out = '';
      while (lines.length && /^### /.test(lines[0])) out += '<h3>' + inline(lines.shift().slice(4)) + '</h3>';
      if (!lines.length) return out;
      if (lines.every(function (l) { return /^- /.test(l); })) return out + '<ul>' + lines.map(function (l) { return '<li>' + inline(l.slice(2)) + '</li>'; }).join('') + '</ul>';
      if (lines.every(function (l) { return /^>/.test(l); })) return out + '<blockquote>' + lines.map(function (l) { return inline(l.replace(/^>\s?/, '')); }).join('<br>') + '</blockquote>';
      return out + '<p>' + lines.map(inline).join('<br>') + '</p>';
    }).join('');
  }
  // 글마다 선택한 실제 화면만 보입니다. img 경로는 news.js에서 관리합니다.
  function shots(images) {
    if (!Array.isArray(images) || !images.length) return '';
    return '<div class="note-shots" aria-label="앱 화면 사진">' + images.map(function (pair) {
      if (!Array.isArray(pair) || pair.length < 2) return '';
      var path = String(pair[0] || ''), caption = String(pair[1] || '');
      if (!path.startsWith('/screens/') || !path.endsWith('.jpg') || path.includes('..')) return '';
      return '<figure><button type="button" class="shot-open" data-src="' + esc(path) +
        '" data-caption="' + esc(caption) + '" aria-label="' + esc(caption) + ' 크게 보기">' +
        '<img src="' + esc(path) + '" alt="' + esc(caption) + '" loading="lazy" decoding="async"></button>' +
        '<figcaption>' + esc(caption) + ' · 눌러서 크게 보기</figcaption></figure>';
    }).join('') + '</div>';
  }
  function day(d) { var m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(d || ''); return m ? m[1] + '년 ' + (+m[2]) + '월 ' + (+m[3]) + '일' : esc(d || ''); }
  function isNote(n) { return n.type === 'note'; }
  // 참고 자료: 여러 줄이면 목록으로
  function src(v) {
    if (!v || !v.length) return '';
    var rows = [].concat(v);
    return '<div class="src"><b>참고 자료</b><ul>' + rows.map(function (r) { return '<li>' + inline(r) + '</li>'; }).join('') + '</ul></div>';
  }
  // 날짜가 있는 것(공지)은 최근 날짜가 위로, 날짜가 없는 것(노트)은 그 아래에 news.js에 적힌 순서대로
  NEWS.sort(function (a, b) {
    if (!a.date !== !b.date) return a.date ? -1 : 1;
    return String(b.date || '').localeCompare(String(a.date || '')) || a._i - b._i;
  });

  // 모든 글에 이름(id)을 붙여요. 공지처럼 id가 없으면 차례로 만들어요(목록에서 바로 가려고)
  NEWS.forEach(function (n, k) { if (!n.id) n.id = (isNote(n) ? 'note-' : 'notice-') + (k + 1); });
  function item(n) {
    var top = n.date ? '<time datetime="' + esc(n.date) + '">' + day(n.date) + '</time>' : '';
    if (isNote(n)) {
      top = '<span class="pill">' + (n.app ? esc(n.app) + ' ' : '') + '개발 노트</span>';
      // 노트: 제목과 요약만 보이고, 누르면 펼쳐져요
      return '<details class="card prose news-item note"' + (n.id ? ' id="' + esc(n.id) + '"' : '') + ' data-type="note" data-app="' + esc(n.app || '') + '"><summary>' + top +
        '<h2 class="h2">' + esc(n.title) + '</h2>' + (n.summary ? '<p class="sum">' + inline(n.summary) + '</p>' : '') +
        '<span class="more" aria-hidden="true"></span></summary>' + body(n.body) +
        shots(n.images) + src(n.source) + '</details>';
    }
    if (n.tag) top += '<span class="pill">' + esc(n.tag) + '</span>';
    return '<article class="card prose news-item"' + (n.id ? ' id="' + esc(n.id) + '"' : '') + ' data-type="notice">' + top +
      '<h2 class="h2">' + esc(n.title) + '</h2>' + body(n.body) + '</article>';
  }
  var list = document.getElementById('list');
  list.innerHTML = NEWS.length ? NEWS.map(item).join('') : '<p class="empty">아직 소식이 없어요.</p>';

  // 노트가 있는 앱들(news.js에 적힌 차례대로). 디다코·텔리오 노트를 더하면 저절로 늘어나요
  var APPS = [];
  NEWS.forEach(function (n) { if (isNote(n) && n.app && APPS.indexOf(n.app) < 0) APPS.push(n.app); });

  // 목록: 공지, 그리고 앱마다 노트 제목
  function tocHtml() {
    var groups = [], notices = NEWS.filter(function (n) { return !isNote(n); });
    if (notices.length) groups.push(['공지', notices]);
    APPS.forEach(function (a) { groups.push([a + ' 개발 노트', NEWS.filter(function (n) { return isNote(n) && n.app === a; })]); });
    var etc = NEWS.filter(function (n) { return isNote(n) && !n.app; });
    if (etc.length) groups.push(['개발 노트', etc]);
    return groups.map(function (g) {
      return '<p class="toc-h">' + esc(g[0]) + ' <span>' + g[1].length + '</span></p><ol>' +
        g[1].map(function (n) { return '<li><a href="#' + esc(n.id) + '">' + esc(n.title) + '</a></li>'; }).join('') + '</ol>';
    }).join('');
  }
  document.getElementById('toc').innerHTML = '<p class="toc-title">목록</p>' + tocHtml();
  document.getElementById('tocMIn').innerHTML = tocHtml();
  document.querySelector('#tocM summary').textContent = '목록 보기 · ' + NEWS.length + '개';

  // [전체 | 공지 | 개발 노트] + 앱 고르기
  var chips = document.getElementById('chips'), appChips = document.getElementById('appChips'), curApp = '';
  appChips.innerHTML = ['<button type="button" data-app="" aria-pressed="true">모든 앱</button>'].concat(APPS.map(function (a) {
    return '<button type="button" data-app="' + esc(a) + '" aria-pressed="false">' + esc(a) + '</button>';
  })).join('');
  function show(type, app) {
    curApp = type === 'note' ? (app || '') : '';
    [].forEach.call(chips.querySelectorAll('button'), function (b) { b.setAttribute('aria-selected', b.getAttribute('data-type') === type); });
    appChips.hidden = type !== 'note' || APPS.length < 2;
    [].forEach.call(appChips.querySelectorAll('button'), function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-app') === curApp); });
    [].forEach.call(list.querySelectorAll('.news-item'), function (el) {
      el.hidden = (type !== 'all' && el.getAttribute('data-type') !== type) || (curApp && el.getAttribute('data-app') !== curApp);
    });
  }
  chips.addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) show(b.getAttribute('data-type')); });
  appChips.addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) show('note', b.getAttribute('data-app')); });
  // 휴대폰 목록에서 하나를 고르면 목록을 접어요
  document.getElementById('tocMIn').addEventListener('click', function (e) { if (e.target.closest('a')) document.getElementById('tocM').open = false; });

  // 사진 단추를 누르면 원본 비율로 확대합니다. ESC·닫기·바깥 영역 누르기로 닫힙니다.
  var shotDialog = document.getElementById('shotDialog');
  var shotLarge = document.getElementById('shotLarge');
  var shotCaption = document.getElementById('shotCaption');
  list.addEventListener('click', function (e) {
    var b = e.target.closest('.shot-open');
    if (!b || !shotDialog || !shotDialog.showModal) return;
    shotLarge.src = b.getAttribute('data-src');
    shotLarge.alt = b.getAttribute('data-caption') || '';
    shotCaption.textContent = b.getAttribute('data-caption') || '';
    shotDialog.showModal();
  });
  document.getElementById('shotClose').addEventListener('click', function () { shotDialog.close(); });
  shotDialog.addEventListener('click', function (e) { if (e.target === shotDialog) shotDialog.close(); });
  shotDialog.addEventListener('close', function () { shotLarge.removeAttribute('src'); });

  // 주소 끝의 #노트id: 그 글을 펼쳐서 보여 줘요(노트 안의 "다음 노트" 링크도 이걸로 움직여요)
  function openHash() {
    var t = location.hash && document.getElementById(location.hash.slice(1));
    if (!t || !t.classList.contains('news-item')) return;
    show('all');
    if (t.tagName === 'DETAILS') t.open = true;
    t.scrollIntoView();
  }
  window.addEventListener('hashchange', openHash);
  openHash();
})();
</script>
</body>
</html>
