<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>소식 · 코이노비아</title>
<meta name="description" content="코이노비아와 세 앱의 업데이트 소식과 안내예요.">
<meta name="theme-color" content="#FFFFFF">
<meta property="og:type" content="website">
<meta property="og:title" content="소식 · 코이노비아">
<meta property="og:description" content="코이노비아와 세 앱의 업데이트 소식과 안내예요.">
<meta property="og:image" content="https://koinobia.com/og.png">
<meta property="og:url" content="https://koinobia.com/news/">
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/page.css">
<link rel="stylesheet" href="/tabs.css">
</head>
<body data-tab="news">
<header class="nav gut">
  <div class="nav-in box">
    <a class="brand" href="/" id="brand" aria-label="코이노비아 홈"></a>
    <nav class="toplinks" id="toplinks" aria-label="메뉴"></nav>
    <a class="btn btn-sm" id="navOpen" href="#" hidden></a>
  </div>
</header>

<main class="gut">
  <div class="narrow">
    <div class="head">
      <p class="eyebrow">소식</p>
      <h1 class="title">코이노비아 소식</h1>
      <p class="lead">앱 업데이트와 안내를 알려 드려요.</p>
    </div>
    <!-- 소식은 news.js에서 가져와 채워요 -->
    <div class="body" id="list"></div>
  </div>
</main>

<footer class="foot gut">
  <div class="foot-in box">
    <span class="foot-brand" id="footBrand"></span>
    <span class="foot-links" id="foot"></span>
  </div>
</footer>
<script src="/site.js"></script>
<script src="/news.js"></script>
<script src="/tabs.js"></script>
<script>
(function () {
  var NEWS = (window.KOINOBIA_NEWS || []).slice();
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  // 한 줄 안의 꾸밈: **굵게**, [글자](https://주소)
  function inline(s) {
    return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+|\/[^)\s]*)\)/g, '<a href="$2">$1</a>');
  }
  // 본문: 빈 줄로 문단을 나누고, "- "로 시작하는 줄은 점 목록으로
  function body(text) {
    return String(text || '').trim().split(/\n\s*\n/).map(function (block) {
      var lines = block.split('\n').map(function (l) { return l.trim(); }).filter(Boolean);
      if (lines.length && lines.every(function (l) { return /^- /.test(l); })) {
        return '<ul>' + lines.map(function (l) { return '<li>' + inline(l.slice(2)) + '</li>'; }).join('') + '</ul>';
      }
      return '<p>' + lines.map(inline).join('<br>') + '</p>';
    }).join('');
  }
  function day(d) { var m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(d || ''); return m ? m[1] + '년 ' + (+m[2]) + '월 ' + (+m[3]) + '일' : esc(d || ''); }
  NEWS.sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });
  document.getElementById('list').innerHTML = NEWS.length ? NEWS.map(function (n) {
    return '<article class="card prose news-item"><time datetime="' + esc(n.date) + '">' + day(n.date) + '</time>' +
      (n.tag ? '<span class="pill">' + esc(n.tag) + '</span>' : '') +
      '<h2 class="h2">' + esc(n.title) + '</h2>' + body(n.body) + '</article>';
  }).join('') : '<p class="empty">아직 소식이 없어요.</p>';
})();
</script>
</body>
</html>
